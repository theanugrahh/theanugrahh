name: Update Profile

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=E8C56D&color_snake_bg=161B22
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=E8C56D&color_snake_bg=161B22

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push

  update-trophies:
    name: Update Trophies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy case
        uses: ryochan7/trophy-case@v1
        with:
          username: ${{ github.repository_owner }}
          theme: github-dark-dimmed
          no-frame: true
          no-bg: true
          margin-w: 12
          margin-h: 12
          column: 6
          output: trophies.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update trophies [skip ci]"
          git push