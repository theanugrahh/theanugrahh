name: Update Profile

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github-light&color_snake=2DA44E&color_snake_bg=F6F8FA&color_dots=EBEDF0,9BE9A8,40C463,30A14E,216E39
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=7EE787&color_snake_bg=161B22&color_dots=161B22,0E4429,006D32,26A641,39D353

      - name: Remove progress bar and crop
        run: |
          python3 - <<'EOF'
          import re

          for path in ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']:
              with open(path) as f:
                  svg = f.read()

              cleaned = re.sub(r'<rect\s+class="u[^>]*?/>', '', svg)
              if cleaned != svg:
                  with open(path, 'w') as f:
                      f.write(cleaned)
                  print('removed progress bar from', path)

              cropped = cleaned.replace('viewBox="-16 -32 880 192"', 'viewBox="-16 -32 880 156"')
              cropped = cropped.replace('width="880" height="192"', 'width="880" height="156"')
              if cropped != cleaned:
                  with open(path, 'w') as f:
                      f.write(cropped)
                  print('cropped', path)

              with open(path) as f:
                  assert re.search(r'<rect class="u\b', f.read()) is None, f'progress bar still present in {path}'
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push