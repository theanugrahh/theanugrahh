name: Update Profile

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    name: Refresh cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github-light&color_snake=#2F55FF&color_snake_bg=#F3F3F1&color_dots=#E2E2DE,#C8D3FF,#94A8FF,#6280FF,#2F55FF
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#6280FF&color_snake_bg=#111111&color_dots=#2A2A2A,#1A3BE0,#2F55FF,#6280FF,#94A8FF

      - name: Remove progress bar and crop snake
        run: |
          python3 - <<'EOF'
          import re

          for path in ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']:
              with open(path) as f:
                  svg = f.read()

              cleaned = re.sub(r'<rect\s+class="u[^>]*?/>', '', svg)
              if cleaned != svg:
                  with open(path, 'w') as f:
                      f.write(cleaned)
                  print('removed progress bar from', path)

              cropped = cleaned.replace('viewBox="-16 -32 880 192"', 'viewBox="-16 -32 880 156"')
              cropped = cropped.replace('width="880" height="192"', 'width="880" height="156"')
              if cropped != cleaned:
                  with open(path, 'w') as f:
                      f.write(cropped)
                  print('cropped', path)

              with open(path) as f:
                  assert re.search(r'<rect class="u\b', f.read()) is None, f'progress bar still present in {path}'
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md data/contributions.json github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
