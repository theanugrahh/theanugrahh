name: Update Profile

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github-light&color_snake=C58A1F&color_dots=EBEDF0,F2E9D8,ECD9A7,E8C56D,D4A843
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=E8C56D&color_dots=161B22,2A3B33,2D5A40,3FBF5F,7EE787

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push