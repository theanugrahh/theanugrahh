<svg width="880" height="380" viewBox="0 0 880 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="workAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="380" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="44" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="4" fill="#D8C08A" font-weight="600">SELECTED WORK</text>
  <line x1="36" y1="58" x2="844" y2="58" stroke="#21262D" stroke-width="1"/>
  <rect x="36" y="56" width="50" height="2" rx="1" fill="#D8C08A" opacity="0.6"/>

  <!-- Project 1: Civitas -->
  <g transform="translate(36, 76)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    
    <!-- Project card -->
    <rect width="808" height="88" rx="12" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    
    <!-- Left accent -->
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#D8C08A" opacity="0.6"/>
    
    <!-- Project number -->
    <text x="20" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700" fill="#21262D">01</text>
    
    <!-- Project name -->
    <text x="76" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">Civitas</text>
    
    <!-- Description -->
    <text x="76" y="56" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">Zero-shot NLP + speech pipeline for civic grievance redressal</text>
    <text x="76" y="74" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">with real-time analytics dashboard.</text>
    
    <!-- Tech tags -->
    <g transform="translate(520, 20)">
      <rect width="68" height="22" rx="4" fill="#21262D"/>
      <text x="34" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">BART-MNLI</text>
    </g>
    <g transform="translate(596, 20)">
      <rect width="72" height="22" rx="4" fill="#21262D"/>
      <text x="36" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">WHISPER</text>
    </g>
    <g transform="translate(676, 20)">
      <rect width="68" height="22" rx="4" fill="#21262D"/>
      <text x="34" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">FASTAPI</text>
    </g>
    <g transform="translate(752, 20)">
      <rect width="56" height="22" rx="4" fill="#21262D"/>
      <text x="28" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">REACT</text>
    </g>
  </g>

  <!-- Project 2: Faculty Workload Management -->
  <g transform="translate(36, 180)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" fill="freeze"/>
    
    <rect width="808" height="88" rx="12" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#58A6FF" opacity="0.6"/>
    
    <text x="20" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700" fill="#21262D">02</text>
    <text x="76" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">Faculty Workload Management</text>
    
    <text x="76" y="56" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">SQL-driven teaching and administrative workload allocation —</text>
    <text x="76" y="74" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">the database does the heavy lifting.</text>
    
    <g transform="translate(640, 20)">
      <rect width="56" height="22" rx="4" fill="#21262D"/>
      <text x="28" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">PHP</text>
    </g>
    <g transform="translate(704, 20)">
      <rect width="72" height="22" rx="4" fill="#21262D"/>
      <text x="36" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#7EE787">MYSQL</text>
    </g>
  </g>

  <!-- Project 3: Aguamenti -->
  <g transform="translate(36, 284)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
    
    <rect width="808" height="88" rx="12" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#D8C08A" opacity="0.8"/>
    
    <text x="20" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700" fill="#21262D">03</text>
    <text x="76" y="32" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">Aguamenti</text>
    
    <!-- Recognition badge -->
    <g transform="translate(236, 16)">
      <rect width="200" height="22" rx="4" fill="#D8C08A" opacity="0.15"/>
      <text x="100" y="15" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" fill="#D8C08A" font-weight="600">🏆 YOUNG INNOVATOR · RUNNER-UP</text>
    </g>
    
    <text x="76" y="56" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">Research on anaerobic wastewater treatment systems —</text>
    <text x="76" y="74" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8B949E">selected from 300+ teams nationwide.</text>
  </g>
</svg>
