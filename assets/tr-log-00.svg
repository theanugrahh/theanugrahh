  <text x="68" y="171" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">national innovation challenge, and taught the first real lesson:    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.79s" fill="freeze"/>
