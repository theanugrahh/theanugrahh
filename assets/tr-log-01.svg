  </text>
  <text x="68" y="97" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="18" fill="#E9F2F6">Teaching machines to listen.    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.60s" fill="freeze"/>
  </text>
  <text x="68" y="127" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">Civitas: zero-shot speech + NLP for civic grievance redressal. A citizen    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.75s" fill="freeze"/>
  </text>
  <text x="68" y="149" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">speaks, the system understands, and the complaint routes itself &#8212; no    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.82s" fill="freeze"/>
  </text>
  <text x="68" y="171" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">labeled datasets, no fine-tuning. And a first lesson in latency:    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.89s" fill="freeze"/>
  </text>
  <text x="68" y="193" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">to someone waiting to be heard, every extra second feels like indifference.    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.96s" fill="freeze"/>
  </text>
