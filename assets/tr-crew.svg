    </circle>
    <text x="540" y="139" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1" fill="#E9F2F6">DOCUMENT</text>
    <text x="540" y="160" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#4A6376">write it as you go</text>
    <text x="540" y="109" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700" fill="#63D7E3">03</text>
