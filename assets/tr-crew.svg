<svg width="880" height="210" viewBox="0 0 880 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="880" height="210" rx="16" fill="#0A1420" stroke="#14243A" stroke-width="1"/>
  <text x="44" y="42" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" letter-spacing="4" font-weight="600" fill="#63D7E3">CREW PROTOCOL</text>
  <text x="836" y="42" text-anchor="end" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" letter-spacing="2" fill="#4A6376">ALWAYS OPERATING</text>
