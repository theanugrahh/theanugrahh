      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="340" y="139" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1" fill="#E9F2F6">BENCHMARK</text>
    <text x="340" y="160" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#4A6376">measure everything</text>
    <text x="340" y="109" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700" fill="#63D7E3">02</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <circle cx="540" cy="104" r="20" fill="#0D1725" stroke="#63D7E3" stroke-width="1.3" opacity="0.7">
