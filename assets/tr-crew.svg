    <text x="142" y="160" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#4A6376">understand before building</text>
    <text x="142" y="109" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700" fill="#63D7E3">01</text>
  </g>
  <g>
