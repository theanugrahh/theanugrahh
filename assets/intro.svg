<svg width="640" height="232" viewBox="0 0 640 232" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .f { opacity: 0; animation: fadeUp .6s ease-out forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .35s; }
    .d4 { animation-delay: .5s; } .d5 { animation-delay: .62s; } .d6 { animation-delay: .74s; }
    .cursor { animation: blink 1s step-start infinite; }
  </style>
  <rect x="0.5" y="0.5" width="639" height="231" rx="14" fill="#12161B" stroke="#2A3038"/>
  <g class="f d1">
    <text x="36" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#D8C08A">ANUGRAH KRISHNAA SREEJITH</text>
  </g>
  <g class="f d2">
    <text x="36" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#E7E2D8">AI / ML · Systems · Research</text>
  </g>
  <g class="f d3">
    <line x1="36" y1="114" x2="604" y2="114" stroke="#2A3038"/>
  </g>
  <g class="f d4">
    <text x="36" y="147" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9AA4AF">I work at the intersection of machine learning and systems —</text>
  </g>
  <g class="f d5">
    <text x="36" y="171" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9AA4AF">taking models from experiment to API to interface, and shipping</text>
  </g>
  <g class="f d6">
    <text x="36" y="195" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9AA4AF">them as real-time, production-grade tools.<tspan class="cursor" fill="#D8C08A"> ▍</tspan></text>
  </g>
</svg>
