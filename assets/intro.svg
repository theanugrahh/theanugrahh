<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="45%" stop-color="#D8C08A"/>
      <stop offset="45%" stop-color="#FFFFFF">
        <animate attributeName="offset" values="45%;95%;95%" dur="3.5s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.85;1"/>
      </stop>
      <stop offset="46%" stop-color="#D8C08A"/>
      <stop offset="100%" stop-color="#D8C08A"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="880" height="300" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Name -->
  <text x="40" y="102" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="36" font-weight="700" letter-spacing="4" fill="url(#nameShimmer)">
    ANUGRAH KRISHNAA SREEJITH
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Role + blinking terminal cursor -->
  <text x="40" y="148" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="17" font-weight="600" letter-spacing="3" fill="#E7E2D8">
    AI / ML &#183; SYSTEMS &#183; RESEARCH
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>
  <rect x="432" y="130" width="10" height="24" fill="#D8C08A">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite" keyTimes="0;0.45;0.5;0.95;1"/>
  </rect>

  <!-- Divider with growing accent -->
  <line x1="40" y1="176" x2="840" y2="176" stroke="#21262D" stroke-width="1"/>
  <rect x="40" y="174" width="64" height="2" rx="1" fill="#D8C08A" opacity="0.55">
    <animate attributeName="width" values="0;64" dur="0.6s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- Description -->
  <text x="40" y="214" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#8B949E">
    I work at the intersection of machine learning and systems &#8212;
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="40" y="238" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#8B949E">
    taking models from experiment to API to interface, and shipping
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.75s" fill="freeze"/>
  </text>
  <text x="40" y="262" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#8B949E">
    them as real-time, production-grade tools.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- Status -->
  <g transform="translate(40, 284)">
    <circle cx="6" cy="0" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="4" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#667079">AVAILABLE FOR COLLABORATION</text>
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>
  </g>
</svg>
