<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="45%" stop-color="#D8C08A"/>
      <stop offset="45%" stop-color="#FFFFFF">
        <animate attributeName="offset" values="45%;95%;95%" dur="3.5s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.85;1"/>
      </stop>
      <stop offset="46%" stop-color="#D8C08A"/>
      <stop offset="100%" stop-color="#D8C08A"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8D5A8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D8C08A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="300" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Subtle horizontal grid -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="880" y2="60" stroke="#D8C08A"/>
    <line x1="0" y1="120" x2="880" y2="120" stroke="#D8C08A"/>
    <line x1="0" y1="180" x2="880" y2="180" stroke="#D8C08A"/>
    <line x1="0" y1="240" x2="880" y2="240" stroke="#D8C08A"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="300" rx="2" fill="#D8C08A" opacity="0.75">
    <animate attributeName="opacity" values="0;0.75;0.75" dur="0.9s" fill="freeze"/>
  </rect>

  <!-- Name with shimmer sweep -->
  <text x="52" y="96" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="40" font-weight="700" letter-spacing="6" fill="url(#nameShimmer)">
    ANUGRAH KRISHNAA SREEJITH
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Role line -->
  <text x="52" y="146" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="19" font-weight="600" letter-spacing="3" fill="#E7E2D8">
    AI / ML · SYSTEMS · RESEARCH
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Divider -->
  <line x1="52" y1="170" x2="828" y2="170" stroke="#21262D" stroke-width="1"/>
  <rect x="52" y="168" width="70" height="2" rx="1" fill="#D8C08A" opacity="0.55">
    <animate attributeName="width" values="0;70" dur="0.6s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- Description -->
  <text x="52" y="204" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    I work at the intersection of machine learning and systems —
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="52" y="228" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    taking models from experiment to API to interface, and shipping
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.75s" fill="freeze"/>
  </text>
  <text x="52" y="252" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    them as real-time, production-grade tools.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- Status indicator -->
  <g transform="translate(52, 274)">
    <circle cx="7" cy="7" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="11" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#667079">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Perimeter scan line -->
  <rect x="52" y="0" width="776" height="2" rx="1" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 300; 0 300" dur="6s" begin="1.5s" repeatCount="indefinite" keyTimes="0;0.9;1"/>
  </rect>

  <!-- Corner marks -->
  <path d="M854 16 L860 16 L860 22" fill="none" stroke="#D8C08A" stroke-width="1.5" opacity="0.35"/>
  <path d="M854 178 L860 178 L860 172" fill="none" stroke="#D8C08A" stroke-width="1.5" opacity="0.35"/>
</svg>