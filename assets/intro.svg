<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="introAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="50%" stop-color="#E8D5A8"/>
      <stop offset="100%" stop-color="#D8C08A"/>
    </linearGradient>
    <filter id="introGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="280" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="40" x2="880" y2="40" stroke="#D8C08A"/>
    <line x1="0" y1="80" x2="880" y2="80" stroke="#D8C08A"/>
    <line x1="0" y1="120" x2="880" y2="120" stroke="#D8C08A"/>
    <line x1="0" y1="160" x2="880" y2="160" stroke="#D8C08A"/>
    <line x1="0" y1="200" x2="880" y2="200" stroke="#D8C08A"/>
    <line x1="0" y1="240" x2="880" y2="240" stroke="#D8C08A"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="280" rx="2" fill="#D8C08A" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0.8" dur="1s" fill="freeze"/>
  </rect>

  <!-- Name -->
  <text x="44" y="52" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" letter-spacing="4" fill="#D8C08A" font-weight="600">
    ANUGRAH KRISHNAA SREEJITH
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Title -->
  <text x="44" y="96" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="26" font-weight="700" fill="#E7E2D8">
    AI / ML · Systems · Research
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Divider with glow -->
  <line x1="44" y1="120" x2="836" y2="120" stroke="#21262D" stroke-width="1"/>
  <rect x="44" y="118" width="60" height="2" rx="1" fill="#D8C08A" opacity="0.5">
    <animate attributeName="width" values="0;60" dur="0.6s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- Description lines -->
  <text x="44" y="156" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    I work at the intersection of machine learning and systems —
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>
  <text x="44" y="182" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    taking models from experiment to API to interface, and shipping
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
  </text>
  <text x="44" y="208" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8B949E">
    them as real-time, production-grade tools.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- Status indicator -->
  <g transform="translate(44, 236)">
    <circle cx="6" cy="6" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11" fill="#667079">Available for collaboration</text>
  </g>

  <!-- Decorative corner marks -->
  <path d="M860 16 L864 16 L864 20" fill="none" stroke="#D8C08A" stroke-width="1" opacity="0.3"/>
  <path d="M860 264 L864 264 L864 260" fill="none" stroke="#D8C08A" stroke-width="1" opacity="0.3"/>
  <path d="M20 264 L16 264 L16 260" fill="none" stroke="#D8C08A" stroke-width="1" opacity="0.3"/>
</svg>
