<svg width="880" height="380" viewBox="0 0 880 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF6FA"/>
      <stop offset="48%" stop-color="#EAF6FA"/>
      <stop offset="48%" stop-color="#D9F6FB">
        <animate attributeName="offset" values="48%;96%;96%" dur="4s" begin="1s" repeatCount="indefinite" keyTimes="0;0.85;1"/>
      </stop>
      <stop offset="49%" stop-color="#EAF6FA"/>
      <stop offset="100%" stop-color="#EAF6FA"/>
    </linearGradient>
    <linearGradient id="streakBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63D7E3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#63D7E3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep space hull -->
  <rect width="880" height="380" rx="16" fill="#050912" stroke="#14243A" stroke-width="1"/>

  <!-- Corner HUD brackets -->
  <path d="M14 30 V16 H28" stroke="#63D7E3" stroke-width="1.5" opacity="0.55"/>
  <path d="M852 16 H866 V30" stroke="#63D7E3" stroke-width="1.5" opacity="0.55"/>
  <path d="M28 364 H14 V350" stroke="#63D7E3" stroke-width="1.5" opacity="0.55"/>
  <path d="M866 350 V364 H852" stroke="#63D7E3" stroke-width="1.5" opacity="0.55"/>

  <!-- Far dust layer: slow counter-drift -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -5 2; 0 0" dur="90s" repeatCount="indefinite"/>
    <circle cx="86" cy="70" r="0.8" fill="#BFD9E4" opacity="0.2"/>
    <circle cx="171" cy="46" r="0.7" fill="#BFD9E4" opacity="0.16"/>
    <circle cx="252" cy="88" r="0.8" fill="#BFD9E4" opacity="0.18"/>
    <circle cx="340" cy="44" r="0.7" fill="#BFD9E4" opacity="0.2"/>
    <circle cx="428" cy="94" r="0.8" fill="#BFD9E4" opacity="0.15"/>
    <circle cx="505" cy="40" r="0.7" fill="#BFD9E4" opacity="0.2"/>
    <circle cx="590" cy="86" r="0.8" fill="#BFD9E4" opacity="0.17"/>
    <circle cx="676" cy="42" r="0.7" fill="#BFD9E4" opacity="0.2"/>
    <circle cx="762" cy="92" r="0.8" fill="#BFD9E4" opacity="0.18"/>
    <circle cx="836" cy="52" r="0.7" fill="#BFD9E4" opacity="0.16"/>
    <circle cx="120" cy="330" r="0.7" fill="#BFD9E4" opacity="0.16"/>
    <circle cx="300" cy="352" r="0.8" fill="#BFD9E4" opacity="0.18"/>
    <circle cx="520" cy="336" r="0.7" fill="#BFD9E4" opacity="0.15"/>
    <circle cx="700" cy="354" r="0.8" fill="#BFD9E4" opacity="0.18"/>
    <circle cx="830" cy="330" r="0.7" fill="#BFD9E4" opacity="0.16"/>
  </g>

  <!-- Starfield: slow drift + twinkles -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 4 -2; 0 0" dur="60s" repeatCount="indefinite"/>
    <circle cx="70" cy="52" r="1.2" fill="#9FC4D8" opacity="0.5"/>
    <circle cx="130" cy="90" r="1" fill="#9FC4D8" opacity="0.25"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="34" r="1" fill="#9FC4D8" opacity="0.35"/>
    <circle cx="243" cy="118" r="1.3" fill="#9FC4D8" opacity="0.55"><animate attributeName="opacity" values="0.55;1;0.55" dur="4.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="305" cy="60" r="1" fill="#9FC4D8" opacity="0.2"/>
    <circle cx="352" cy="26" r="1.1" fill="#9FC4D8" opacity="0.4"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.8s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="82" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="472" cy="38" r="1.2" fill="#9FC4D8" opacity="0.45"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="519" cy="102" r="1" fill="#9FC4D8" opacity="0.2"/>
    <circle cx="583" cy="54" r="1.1" fill="#9FC4D8" opacity="0.4"/>
    <circle cx="641" cy="24" r="1" fill="#9FC4D8" opacity="0.3"><animate attributeName="opacity" values="0.3;0.75;0.3" dur="3.5s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="698" cy="94" r="1.3" fill="#9FC4D8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="752" cy="48" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="816" cy="110" r="1.1" fill="#9FC4D8" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.1s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="160" r="1" fill="#9FC4D8" opacity="0.3"/>
    <circle cx="104" cy="230" r="1.2" fill="#9FC4D8" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="776" cy="188" r="1" fill="#9FC4D8" opacity="0.3"/>
    <circle cx="822" cy="258" r="1.2" fill="#9FC4D8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="76" cy="305" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="160" cy="338" r="1.2" fill="#9FC4D8" opacity="0.45"><animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="252" cy="314" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="336" cy="345" r="1.1" fill="#9FC4D8" opacity="0.35"/>
    <circle cx="452" cy="322" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="548" cy="344" r="1.2" fill="#9FC4D8" opacity="0.45"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="4.2s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="644" cy="316" r="1" fill="#9FC4D8" opacity="0.25"/>
    <circle cx="730" cy="340" r="1.2" fill="#9FC4D8" opacity="0.5"/>
    <circle cx="812" cy="320" r="1" fill="#9FC4D8" opacity="0.2"/>
    <!-- constellation -->
    <polyline points="96,132 210,64 336,116 402,52 528,96 604,58 704,120" stroke="#1E3247" stroke-width="1" fill="none"/>
    <circle cx="96" cy="132" r="2" fill="#63D7E3" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="64" r="2" fill="#63D7E3" opacity="0.35"/>
    <circle cx="336" cy="116" r="2" fill="#63D7E3" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.9s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="402" cy="52" r="2" fill="#63D7E3" opacity="0.35"/>
    <circle cx="528" cy="96" r="2" fill="#63D7E3" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.3s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="604" cy="58" r="2" fill="#63D7E3" opacity="0.3"/>
    <circle cx="704" cy="120" r="2" fill="#63D7E3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shooting star: one pass every ~11s, then long rest -->
  <g opacity="0">
    <line x1="0" y1="0" x2="-52" y2="-18" stroke="url(#streak)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="3" cy="1" r="1.6" fill="#CBEFF5"/>
    <animateTransform attributeName="transform" type="translate" values="60 84; 480 250; 480 250" dur="11s" begin="1.6s" repeatCount="indefinite" keyTimes="0;0.16;1"/>
    <animate attributeName="opacity" values="0;1;0;0" dur="11s" begin="1.6s" repeatCount="indefinite" keyTimes="0;0.05;0.15;1"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="52" y2="-18" stroke="url(#streakBack)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-3" cy="1" r="1.6" fill="#CBEFF5"/>
    <animateTransform attributeName="transform" type="translate" values="700 60; 300 190; 300 190" dur="13s" begin="6.4s" repeatCount="indefinite" keyTimes="0;0.14;1"/>
    <animate attributeName="opacity" values="0;0.9;0;0" dur="13s" begin="6.4s" repeatCount="indefinite" keyTimes="0;0.04;0.13;1"/>
  </g>

  <!-- Top-left: incoming transmission -->
  <g transform="translate(44, 38)">
    <circle cx="5" cy="-3" r="3" fill="#63D7E3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="1" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" letter-spacing="3" fill="#63D7E3" opacity="0.85">INCOMING TRANSMISSION</text>
  </g>

  <!-- Top-right: signal strength -->
  <g transform="translate(802, 28)">
    <rect x="0" y="8" width="4" height="10" fill="#63D7E3" opacity="0.9"/>
    <rect x="8" y="8" width="4" height="10" fill="#63D7E3" opacity="0.9"/>
    <rect x="16" y="8" width="4" height="10" fill="#63D7E3" opacity="0.9"/>
    <rect x="24" y="8" width="4" height="10" fill="#63D7E3" opacity="0.9"/>
    <rect x="32" y="8" width="4" height="10" fill="#63D7E3" opacity="0.2"/>
  </g>

  <!-- Name -->
  <text x="440" y="172" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="35" font-weight="700" letter-spacing="5" fill="url(#nameSweep)">
    ANUGRAH KRISHNAA SREEJITH
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Role -->
  <text x="440" y="212" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" letter-spacing="6" fill="#9BC7D6">
    AI / ML &#183; SYSTEMS &#183; RESEARCH
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- Divider with node -->
  <line x1="250" y1="242" x2="422" y2="242" stroke="#1E2C3F" stroke-width="1"/>
  <line x1="458" y1="242" x2="630" y2="242" stroke="#1E2C3F" stroke-width="1"/>
  <rect x="435" y="237" width="10" height="10" transform="rotate(45 440 242)" fill="none" stroke="#63D7E3" stroke-width="1.3">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="440" y="276" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#8FA8BC">
    I take models from experiment to API to interface &#8212; and keep them running.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze"/>
  </text>

  <!-- Telemetry strip -->
  <g>
    <circle cx="188" cy="326" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="202" y="330" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#63D7E3">STATUS: IN ORBIT</text>
    <text x="356" y="330" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#4A6376">&#183;</text>
    <text x="374" y="330" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#4A6376">EXPLORING: REAL-TIME CV</text>
    <text x="574" y="330" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#4A6376">&#183;</text>
    <text x="592" y="330" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#F0B37E">COFFEE: CRITICAL</text>
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.1s" fill="freeze"/>
  </g>
</svg>
