<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Card -->
  <rect width="880" height="300" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="46" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="4" fill="#D8C08A" font-weight="600">HOW I WORK</text>
  <text x="840" y="46" text-anchor="end" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" letter-spacing="2" fill="#667079">PIPELINE + PRINCIPLES</text>
  <line x1="40" y1="60" x2="840" y2="60" stroke="#21262D" stroke-width="1"/>
  <rect x="40" y="58" width="50" height="2" rx="1" fill="#D8C08A" opacity="0.6">
    <animate attributeName="width" values="0;50" dur="0.5s" fill="freeze"/>
  </rect>

  <!-- ======== Pipeline ======== -->
  <text x="40" y="90" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="2" fill="#667079">PIPELINE</text>

  <!-- Step 1: Idea -->
  <g transform="translate(40, 98)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <circle cx="24" cy="24" r="21" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#D8C08A">01</text>
    <text x="58" y="21" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#E7E2D8">Idea</text>
    <text x="58" y="40" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">research &amp; define the problem</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(282, 120)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <line x1="0" y1="0" x2="52" y2="0" stroke="#30363D" stroke-width="1.5"/>
    <path d="M46 -4 L54 0 L46 4" fill="none" stroke="#D8C08A" stroke-width="1.5"/>
  </g>

  <!-- Step 2: Model -->
  <g transform="translate(330, 98)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <circle cx="24" cy="24" r="21" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#D8C08A">02</text>
    <text x="58" y="21" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#E7E2D8">Model</text>
    <text x="58" y="40" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">train, evaluate, iterate</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(534, 120)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze"/>
    <line x1="0" y1="0" x2="52" y2="0" stroke="#30363D" stroke-width="1.5"/>
    <path d="M46 -4 L54 0 L46 4" fill="none" stroke="#D8C08A" stroke-width="1.5"/>
  </g>

  <!-- Step 3: System -->
  <g transform="translate(582, 98)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <circle cx="24" cy="24" r="21" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#D8C08A">03</text>
    <text x="58" y="21" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#E7E2D8">System</text>
    <text x="58" y="40" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">deploy, monitor, ship</text>
  </g>

  <!-- ======== Principles ======== -->
  <text x="40" y="180" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="2" fill="#667079">PRINCIPLES</text>

  <g transform="translate(40, 192)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="15" r="3" fill="#D8C08A"/>
    <text x="28" y="19" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Research first</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">understand before building</text>
  </g>

  <g transform="translate(246, 192)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="15" r="3" fill="#D8C08A"/>
    <text x="28" y="19" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Benchmark</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">measure everything</text>
  </g>

  <g transform="translate(452, 192)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="15" r="3" fill="#D8C08A"/>
    <text x="28" y="19" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Document</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">write it as you go</text>
  </g>

  <g transform="translate(658, 192)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
    <rect width="182" height="46" rx="9" fill="none" stroke="#D8C08A" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="16" cy="15" r="3" fill="#D8C08A"/>
    <text x="28" y="19" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Ship often</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">small, fast releases</text>
  </g>

  <!-- Tagline -->
  <line x1="40" y1="262" x2="840" y2="262" stroke="#21262D" stroke-width="1"/>
  <text x="440" y="280" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#8B949E">
    $ research &#183; experiment &#183; engineer &#183; ship
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>
</svg>
