  <text x="68" y="127" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">DevVault grew the whole chain: accounts, projects, scoped keys, a    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze"/>
  </text>
  <text x="68" y="149" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">rate-limited API, request logs, usage analytics &#8212; every call accountable.    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.92s" fill="freeze"/>
  </text>
  <text x="68" y="171" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">FWM_DBMS did one thing well: stopped fighting scheduling in application    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.99s" fill="freeze"/>
  </text>
  <text x="68" y="193" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#8FA8BC">code and let the database do the heavy lifting. Both shipped. Both run.    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.06s" fill="freeze"/>
