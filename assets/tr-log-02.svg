  <text x="68" y="97" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="18" fill="#E9F2F6">From experiments to infrastructure.    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.70s" fill="freeze"/>
