<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="300" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="44" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="4" fill="#D8C08A" font-weight="600">HOW I WORK</text>
  <line x1="36" y1="58" x2="844" y2="58" stroke="#21262D" stroke-width="1"/>
  <rect x="36" y="56" width="50" height="2" rx="1" fill="#D8C08A" opacity="0.6"/>

  <!-- Pipeline label -->
  <text x="36" y="88" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="2" fill="#667079">PIPELINE</text>

  <!-- Step 1: Idea -->
  <g transform="translate(48, 96)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <circle cx="26" cy="26" r="22" fill="#161B22" stroke="#D8C08A" stroke-width="1.5"/>
    <text x="26" y="32" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="700" fill="#D8C08A">01</text>
    <text x="62" y="23" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">Idea</text>
    <text x="62" y="42" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#667079">Research &amp; define the problem</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(272, 118)">
    <animate attributeName="opacity" values="0;0.55;0.55" dur="0.4s" begin="0.5s" fill="freeze"/>
    <line x1="0" y1="0" x2="56" y2="0" stroke="#30363D" stroke-width="1.5"/>
    <path d="M50 -4 L58 0 L50 4" fill="none" stroke="#D8C08A" stroke-width="1.5"/>
  </g>

  <!-- Step 2: Model -->
  <g transform="translate(320, 96)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <circle cx="26" cy="26" r="22" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="26" y="32" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="700" fill="#58A6FF">02</text>
    <text x="62" y="23" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">Model</text>
    <text x="62" y="42" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#667079">Train, evaluate, iterate</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(544, 118)">
    <animate attributeName="opacity" values="0;0.55;0.55" dur="0.4s" begin="0.85s" fill="freeze"/>
    <line x1="0" y1="0" x2="56" y2="0" stroke="#30363D" stroke-width="1.5"/>
    <path d="M50 -4 L58 0 L50 4" fill="none" stroke="#58A6FF" stroke-width="1.5"/>
  </g>

  <!-- Step 3: System -->
  <g transform="translate(592, 96)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <circle cx="26" cy="26" r="22" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
    <text x="26" y="32" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="700" fill="#3FB950">03</text>
    <text x="62" y="23" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#E7E2D8">System</text>
    <text x="62" y="42" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#667079">Deploy, monitor, ship</text>
  </g>

  <!-- Principles label -->
  <text x="36" y="178" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="2" fill="#667079">PRINCIPLES</text>

  <!-- Principle chips -->
  <g transform="translate(36, 190)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="14" r="3" fill="#D8C08A"/>
    <text x="28" y="17" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Research first</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">Understand before building</text>
  </g>

  <g transform="translate(242, 190)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="14" r="3" fill="#58A6FF"/>
    <text x="28" y="17" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Benchmark</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">Measure everything</text>
  </g>

  <g transform="translate(448, 190)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="14" r="3" fill="#3FB950"/>
    <text x="28" y="17" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Document</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">Write it as you go</text>
  </g>

  <g transform="translate(654, 190)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
    <rect width="190" height="46" rx="9" fill="#161B22" stroke="#D8C08A" stroke-width="1"/>
    <circle cx="16" cy="14" r="3" fill="#D8C08A"/>
    <text x="28" y="17" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#E7E2D8">Ship often</text>
    <text x="16" y="35" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9" fill="#667079">Small, fast releases</text>
  </g>

  <!-- Bottom tagline -->
  <line x1="36" y1="262" x2="844" y2="262" stroke="#21262D" stroke-width="1"/>
  <text x="440" y="280" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" fill="#8B949E">
    $ research · $ experiment · $ engineer · $ ship
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>
</svg>