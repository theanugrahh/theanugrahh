<svg width="440" height="280" viewBox="0 0 440 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C08A"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="280" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="40" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="4" fill="#D8C08A" font-weight="600">PROCESS</text>
  <line x1="32" y1="54" x2="408" y2="54" stroke="#21262D" stroke-width="1"/>
  <rect x="32" y="52" width="40" height="2" rx="1" fill="#D8C08A" opacity="0.6"/>

  <!-- Step 1: Idea -->
  <g transform="translate(32, 80)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    
    <!-- Step circle -->
    <circle cx="24" cy="24" r="20" fill="#161B22" stroke="#D8C08A" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#D8C08A">01</text>
    
    <!-- Step content -->
    <text x="56" y="20" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="600" fill="#E7E2D8">Idea</text>
    <text x="56" y="38" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">Research &amp; Define</text>
    
    <!-- Icon -->
    <circle cx="370" cy="24" r="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="370" y="29" text-anchor="middle" font-family="sans-serif" font-size="16">💡</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(56, 130)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#21262D" stroke-width="1"/>
    <polygon points="-4,16 4,16 0,24" fill="#D8C08A" opacity="0.4"/>
  </g>

  <!-- Step 2: Model -->
  <g transform="translate(32, 152)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
    
    <circle cx="24" cy="24" r="20" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#58A6FF">02</text>
    
    <text x="56" y="20" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="600" fill="#E7E2D8">Model</text>
    <text x="56" y="38" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">Train &amp; Experiment</text>
    
    <circle cx="370" cy="24" r="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="370" y="29" text-anchor="middle" font-family="sans-serif" font-size="16">🧠</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(56, 202)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#21262D" stroke-width="1"/>
    <polygon points="-4,16 4,16 0,24" fill="#58A6FF" opacity="0.4"/>
  </g>

  <!-- Step 3: System -->
  <g transform="translate(32, 224)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
    
    <circle cx="24" cy="24" r="20" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700" fill="#3FB950">03</text>
    
    <text x="56" y="20" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="600" fill="#E7E2D8">System</text>
    <text x="56" y="38" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">Deploy &amp; Ship</text>
    
    <circle cx="370" cy="24" r="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="370" y="29" text-anchor="middle" font-family="sans-serif" font-size="16">🚀</text>
  </g>

  <!-- Bottom tagline -->
  <line x1="32" y1="262" x2="408" y2="262" stroke="#21262D" stroke-width="1"/>
  <text x="220" y="276" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" fill="#667079">research · experiment · engineer · ship</text>
</svg>
