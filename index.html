<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anugrah Krishnaa Sreejith, AI/ML, systems, and research.">
  <meta name="theme-color" content="#F3F3F1">
  <title>theanugrahh, AI/ML, systems, research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper: #F3F3F1;
      --ink: #111111;
      --ink-soft: #3A3A3C;
      --muted: #6E6E73;
      --rule: #DCDCD7;
      --accent: #2F55FF;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--paper);
      color: var(--ink-soft);
      font-family: Newsreader, Georgia, "Times New Roman", serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }
    .cards { display: grid; gap: 18px; }
    .cards img, .snake img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }
    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px 0 2px;
    }
    .links a { display: block; border-radius: 10px; }
    .links img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .links a:hover { opacity: .88; }
    .caption {
      margin: 8px 0 2px;
      text-align: center;
      color: var(--muted);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: .08em;
    }
    .snake { margin-top: 10px; }
    .footer {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: .05em;
    }
    @media (max-width: 620px) {
      .page { width: calc(100% - 28px); padding-top: 28px; }
      .footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="cards">
      <img src="cards/hero.svg" alt="Anugrah Krishnaa Sreejith, AI/ML, systems, research">
    </div>

    <nav class="links" aria-label="Contact">
      <a href="mailto:sreejith.anugrah@gmail.com"><img src="cards/email.svg" alt="Email"></a>
      <a href="https://www.linkedin.com/in/anugrahkrishnaasreejith/"><img src="cards/linkedin.svg" alt="LinkedIn"></a>
    </nav>

    <div class="cards">
      <img src="cards/story.svg" alt="The point: building systems that make real impact">
      <img src="cards/middle.svg" alt="I care about the unglamorous middle">
      <img src="cards/flow.svg" alt="The flow from problem to impact">
      <img src="cards/public.svg" alt="Public work and contribution activity">
    </div>

    <p class="caption">THE LAST YEAR · one commit at a time · refreshed every 6 hours</p>

    <div class="snake">
      <img src="github-contribution-grid-snake.svg" alt="Contribution snake">
    </div>

    <footer class="footer">
      <span>Anugrah Krishnaa Sreejith</span>
      <span>refreshed every 6 hours</span>
    </footer>
  </main>
</body>
</html>
