<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anugrah Krishnaa Sreejith — AI / ML Engineering Student, Systems & Research">
  <meta name="theme-color" content="#0d1117">
  <title>theanugrahh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #e8c56d;
      --accent-dim: #d4a843;
      --border: #30363d;
      --card: #161b22;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #b8860b;
        --accent-dim: #9a730a;
        --border: #d0d7de;
        --card: #f6f8fa;
      }
    }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }
    .container { max-width: 600px; text-align: center; }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #0d1117;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(232, 197, 109, 0.2);
      overflow: hidden;
      position: relative;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .4s ease;
    }
    .avatar img.loaded { opacity: 1; }
    .avatar span {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar img.loaded + span { display: none; }

    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; font-weight: 400; }

    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(232, 197, 109, 0.15);
    }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .link svg { width: 18px; height: 18px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 2rem; }
    .stat { padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
    }
    .stat-value.pending { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

    .footer { margin-top: 3rem; color: var(--muted); font-size: 0.875rem; font-family: 'JetBrains Mono', monospace; }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Entrance animation, disabled for users who prefer reduced motion */
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp .6s ease-out forwards;
      }
      .avatar { animation-delay: .05s; }
      h1 { animation-delay: .15s; }
      .subtitle { animation-delay: .25s; }
      .links { animation-delay: .35s; }
      .stats { animation-delay: .45s; }
      .footer { animation-delay: .55s; }
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .stats { grid-template-columns: 1fr; }
      .links { flex-direction: column; align-items: center; }
      .link { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar reveal">
      <img id="avatarImg" alt="">
      <span id="avatarFallback">AK</span>
    </div>
    <h1 class="reveal">theanugrahh</h1>
    <p class="subtitle reveal">AI / ML Engineering Student · Systems &amp; Research</p>

    <div class="links reveal">
      <a href="https://github.com/theanugrahh" class="link" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/anugrahkrishnaasreejith/" class="link" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="mailto:sreejith.anugrah@gmail.com" class="link" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </a>
    </div>

    <div class="stats reveal">
      <div class="stat">
        <div class="stat-value pending" id="repos">—</div>
        <div class="stat-label">Repositories</div>
      </div>
      <div class="stat">
        <div class="stat-value pending" id="stars">—</div>
        <div class="stat-label">Total Stars</div>
      </div>
      <div class="stat">
        <div class="stat-value pending" id="followers">—</div>
        <div class="stat-label">Followers</div>
      </div>
    </div>

    <p class="footer reveal">
      <a href="https://github.com/theanugrahh" target="_blank" rel="noopener">github.com/theanugrahh</a>
    </p>
  </div>

  <script>
    const setStat = (id, value) => {
      const el = document.getElementById(id);
      el.textContent = value.toLocaleString();
      el.classList.remove('pending');
    };

    fetch('https://api.github.com/users/theanugrahh')
      .then(r => r.json())
      .then(d => {
        setStat('repos', d.public_repos);
        setStat('followers', d.followers);

        if (d.avatar_url) {
          const img = document.getElementById('avatarImg');
          img.src = d.avatar_url;
          img.alt = d.name || 'theanugrahh';
          img.onload = () => img.classList.add('loaded');
        }
      })
      .catch(() => {});

    // Total stars isn't exposed on the user endpoint, so sum it from the
    // repo list (owned, non-fork repos) instead of guessing at a number.
    fetch('https://api.github.com/users/theanugrahh/repos?per_page=100&type=owner')
      .then(r => r.json())
      .then(repos => {
        if (!Array.isArray(repos)) return;
        const total = repos
          .filter(repo => !repo.fork)
          .reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
        setStat('stars', total);
      })
      .catch(() => {});
  </script>
</body>
</html>
